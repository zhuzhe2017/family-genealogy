<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家谱树 · Canvas 数据生成器 + 布局预览</title>
<style>
  :root {
    --bar-bg: #2f2a24;
    --bar-text: #f0e9dd;
    --accent: #b5532a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5efe3;
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bar-bg);
    color: var(--bar-text);
    font-size: 13px;
  }
  .toolbar .brand { font-weight: 600; margin-right: 6px; }
  .toolbar button {
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: var(--bar-text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .toolbar button:hover { background: rgba(255,255,255,0.12); }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .stats {
    margin-left: auto;
    display: flex;
    gap: 14px;
    font-variant-numeric: tabular-nums;
    color: #cfc5b6;
  }
  .stats b { color: #fff; font-weight: 600; }
  .hint {
    font-size: 12px;
    color: #9a9185;
  }
  #stage {
    flex: 1;
    position: relative;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #tree {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <span class="brand">家谱树布局预览</span>
    <button data-gens="5" data-fanout="3">121 人</button>
    <button data-gens="7" data-fanout="3">1093 人</button>
    <button data-gens="8" data-fanout="3" class="active">3280 人</button>
    <button id="reset">重置视图</button>
    <div class="stats">
      <span>成员 <b id="stat-nodes">0</b></span>
      <span>代数 <b id="stat-gens">0</b></span>
      <span>画布 <b id="stat-size">0×0</b></span>
      <span>缩放 <b id="stat-scale">1.0</b></span>
      <span>本帧绘制 <b id="stat-drawn">0</b></span>
    </div>
  </div>

  <div id="stage">
    <canvas id="tree"></canvas>
  </div>

<script>
"use strict";

/* ==========================================================================
   常量：节点尺寸、间距、配色（性别 / 辈分）
   ========================================================================== */
var NODE_W = 120;      // 节点卡片宽度（世界坐标 px）
var NODE_H = 76;       // 节点卡片高度
var LEVEL_H = 140;     // 代际垂直间距
var NODE_GAP_X = 24;   // 同级节点水平间距
var PADDING = 24;      // 画布内边距
var MIN_SCALE = 0.0005; // 最小缩放（允许缩到看全 3000 人整体轮廓）
var MAX_SCALE = 1.6;    // 最大缩放

var GENDER_COLORS = { male: '#3f6fd1', female: '#d1617f' };
var GEN_COLORS = ['#8b1a1a', '#b5532a', '#a08040', '#5a7a5a']; // 辈分色阶循环

/* LOD 阈值（卡片屏幕宽度 px） */
var LOD_BLOCK = 40;    // < 40px 只画色块
var LOD_MEDIUM = 90;   // < 90px 简版（名字），≥ 90px 完整（含生卒年）

/* ==========================================================================
   阶段 0：数据生成器
   --------------------------------------------------------------------------
   genFamily(gens, fanout) 生成一棵「满 fanout 叉」的家族树，共 gens 代。
   总人数 = (fanout^gens - 1) / (fanout - 1)：
     gens=5, fanout=3 → 121
     gens=7, fanout=3 → 1093
     gens=8, fanout=3 → 3280
   返回扁平 members 数组（含 fatherId 建立父子关系，children 数组供布局遍历）。
   ========================================================================== */
var SURNAMES = '朱';
var GEN_CHARS = ['德','永','世','昌','文','明','景','运','贤','良','光','大'];
var GIVEN_CHARS = ['安','邦','国','华','伟','强','敏','丽','芳','秀','英','杰','军','平','海','涛','志','远','阳','光','春','秋'];
var SPOUSE_SURNAMES = ['李','王','赵','陈','周','刘','张','杨','黄','吴'];

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function buildName(generation) {
  var genChar = GEN_CHARS[(generation - 1) % GEN_CHARS.length];
  var given = GIVEN_CHARS[Math.floor(Math.random() * GIVEN_CHARS.length)];
  return SURNAMES + genChar + given;
}

function genFamily(gens, fanout) {
  var members = [];
  var id = 0;

  function makeNode(fatherId, generation) {
    id++;
    var gender = Math.random() < 0.5 ? 'male' : 'female';
    var birthYear = 1940 - (generation - 1) * 28 + randInt(0, 6);
    var dead = generation <= 3 && Math.random() < 0.7;
    var node = {
      id: id,
      name: buildName(generation),
      gender: gender,
      fatherId: fatherId || null,
      generation: generation,
      birthYear: birthYear,
      deathYear: dead ? birthYear + randInt(70, 92) : null,
      spouseName: Math.random() < 0.55
        ? SPOUSE_SURNAMES[Math.floor(Math.random() * SPOUSE_SURNAMES.length)] + '氏'
        : null,
      children: []
    };
    members.push(node);
    return node;
  }

  function build(father, gen) {
    if (gen > gens) return;
    for (var i = 0; i < fanout; i++) {
      var child = makeNode(father ? father.id : null, gen);
      if (father) father.children.push(child);
      build(child, gen + 1);
    }
  }

  var root = makeNode(null, 1);
  build(root, 2);
  return { members: members, root: root };
}

/* ==========================================================================
   阶段 2：布局算法（自底向上，子树依次排列，父节点居中到子树范围中心）
   --------------------------------------------------------------------------
   与小程序端 calcLayout 的 currentX+shift 不同，这里采用「子树区间依次
   排列」的正确算法：叶子从左到右分配，父节点居中到子树范围中心，宽度
   不会因满叉树而膨胀（3000 人时宽度约 = 最底层人数 × 卡片间距）。
   ========================================================================== */
function calcLayout(root) {
  var layoutMap = {};

  function traverse(node, startX) {
    if (node.children.length === 0) {
      var y = PADDING + (node.generation - 1) * LEVEL_H;
      layoutMap[node.id] = { x: startX, y: y, width: NODE_W, node: node };
      return { left: startX, right: startX + NODE_W };
    }

    var childX = startX;
    var childBounds = [];
    node.children.forEach(function (child) {
      var b = traverse(child, childX);
      childBounds.push(b);
      childX = b.right + NODE_GAP_X;
    });

    var left = childBounds[0].left;
    var right = childBounds[childBounds.length - 1].right;
    var center = (left + right) / 2;
    var x = center - NODE_W / 2;
    var y = PADDING + (node.generation - 1) * LEVEL_H;
    layoutMap[node.id] = { x: x, y: y, width: NODE_W, node: node };

    return { left: left, right: right };
  }

  traverse(root, PADDING);
  return layoutMap;
}

/* ==========================================================================
   阶段 3：空间索引 + 视口裁剪（按代分层，代内按 x 升序二分）
   ========================================================================== */
function buildSpatialIndex(members, layoutMap) {
  var index = {};
  members.forEach(function (n) {
    var l = layoutMap[n.id];
    if (!l) return;
    var gen = n.generation || 1;
    (index[gen] = index[gen] || []).push(l);
  });
  Object.keys(index).forEach(function (g) { index[g].sort(function (a, b) { return a.x - b.x; }); });
  return index;
}

function forEachVisible(index, viewTop, viewBottom, viewLeft, viewRight, cb) {
  var gMin = Math.floor((viewTop - PADDING) / LEVEL_H) + 1;
  var gMax = Math.ceil((viewBottom - PADDING) / LEVEL_H) + 1;
  for (var g = Math.max(1, gMin); g <= gMax; g++) {
    var arr = index[g];
    if (!arr || !arr.length) continue;
    var lo = 0, hi = arr.length;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (arr[mid].x + arr[mid].width < viewLeft) lo = mid + 1;
      else hi = mid;
    }
    for (var i = lo; i < arr.length; i++) {
      var l = arr[i];
      if (l.x > viewRight) break;
      cb(l.node, l);
    }
  }
}

/* ==========================================================================
   渲染状态（与画布 / 视图变换相关）
   ========================================================================== */
var members = [], root = null, layoutMap = {}, index = {};
var pan = { x: 0, y: 0 };
var zoom = 1;
var scale = 1, offsetX = 0, offsetY = 0;
var boundsCache = null;
var drawnCount = 0;

var canvas = document.getElementById('tree');
var ctx = canvas.getContext('2d');
var dpr = window.devicePixelRatio || 1;

/* ==========================================================================
   阶段 2/3 辅助：尺寸、适配缩放、视图变换
   ========================================================================== */
function getBounds() {
  if (boundsCache) return boundsCache;
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  Object.keys(layoutMap).forEach(function (k) {
    var l = layoutMap[k];
    minX = Math.min(minX, l.x);
    minY = Math.min(minY, l.y);
    maxX = Math.max(maxX, l.x + l.width);
    maxY = Math.max(maxY, l.y + NODE_H);
  });
  boundsCache = {
    minX: minX, minY: minY,
    width: maxX - minX || NODE_W,
    height: maxY - minY || NODE_H
  };
  return boundsCache;
}

function getContentSize() {
  var b = getBounds();
  return { contentW: b.width + PADDING * 2, contentH: b.height + PADDING * 2 };
}

function computeFitScale(contentW, contentH) {
  var vw = canvas.clientWidth, vh = canvas.clientHeight;
  var fitX = vw / contentW, fitY = vh / contentH;
  var fit;
  if (contentW > vw && contentH > vh) fit = Math.min(fitX, fitY);
  else if (contentW > vw) fit = fitX;
  else fit = Math.max(fitX, fitY);
  return Math.max(MIN_SCALE, Math.min(1.2, fit));
}

function getViewTransform() {
  var cs = getContentSize();
  var fit = computeFitScale(cs.contentW, cs.contentH);
  var s = fit * zoom;
  var ox = (canvas.clientWidth - cs.contentW * s) / 2 + pan.x;
  var oy = (canvas.clientHeight - cs.contentH * s) / 2 + pan.y;
  return { scale: s, offsetX: ox, offsetY: oy };
}

/* ==========================================================================
   阶段 4：绘制（连接线 + 节点，含 LOD）
   ========================================================================== */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawConnection(ctx, p, c) {
  var px = p.x + p.width / 2;
  var py = p.y + NODE_H;
  var cx = c.x + c.width / 2;
  var cy = c.y;
  var midY = py + (cy - py) / 2;
  ctx.beginPath();
  ctx.strokeStyle = '#c9b99a';
  ctx.lineWidth = 1.5;
  ctx.moveTo(px, py);
  ctx.lineTo(px, midY);
  ctx.lineTo(cx, midY);
  ctx.lineTo(cx, cy);
  ctx.stroke();
}

function drawNode(ctx, l, s) {
  var node = l.node;
  var sw = NODE_W * s; // 卡片屏幕宽度
  var genColor = GEN_COLORS[(node.generation - 1) % GEN_COLORS.length];
  var genderColor = GENDER_COLORS[node.gender] || GENDER_COLORS.male;

  // LOD：远景只画辈分色块，跳过卡片细节
  if (sw < LOD_BLOCK) {
    ctx.fillStyle = genColor;
    ctx.fillRect(l.x, l.y, NODE_W, NODE_H);
    return;
  }

  roundRect(ctx, l.x, l.y, NODE_W, NODE_H, 10);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#e6dccb';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 顶部辈分色条
  ctx.fillStyle = genColor;
  ctx.fillRect(l.x + 12, l.y, NODE_W - 24, 3);

  // 头像（性别色）
  var ax = l.x + 24, ay = l.y + NODE_H / 2;
  ctx.beginPath();
  ctx.arc(ax, ay, 16, 0, Math.PI * 2);
  ctx.fillStyle = genderColor;
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(node.name.charAt(1), ax, ay + 1);

  // 姓名
  ctx.fillStyle = '#3d342a';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(node.name, ax + 12, ay);

  // LOD：卡片足够大时才绘制生卒年
  if (sw >= LOD_MEDIUM) {
    var years = node.deathYear ? (node.birthYear + '—' + node.deathYear) : (node.birthYear + '—');
    ctx.fillStyle = '#6b6155';
    ctx.font = '10px sans-serif';
    ctx.fillText(years, ax + 12, ay + 16);
  }
}

function render() {
  var vw = canvas.clientWidth, vh = canvas.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#f5efe3';
  ctx.fillRect(0, 0, vw, vh);

  var t = getViewTransform();
  scale = t.scale; offsetX = t.offsetX; offsetY = t.offsetY;

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  var viewLeft = -offsetX / scale;
  var viewTop = -offsetY / scale;
  var viewRight = (vw - offsetX) / scale;
  var viewBottom = (vh - offsetY) / scale;

  drawnCount = 0;

  // 连线：向上扩展一代，保证父代到当前代的连线完整
  forEachVisible(index, viewTop - LEVEL_H, viewBottom, viewLeft, viewRight, function (node, l) {
    node.children.forEach(function (child) {
      var cl = layoutMap[child.id];
      if (!cl) return;
      if (cl.x + cl.width < viewLeft || cl.x > viewRight ||
          cl.y + NODE_H < viewTop || cl.y > viewBottom) return;
      drawConnection(ctx, l, cl);
    });
  });

  // 节点：仅视口内
  forEachVisible(index, viewTop, viewBottom, viewLeft, viewRight, function (node, l) {
    drawNode(ctx, l, scale);
    drawnCount++;
  });

  ctx.restore();

  document.getElementById('stat-scale').textContent = scale.toFixed(3);
  document.getElementById('stat-drawn').textContent = drawnCount;
}

/* ==========================================================================
   阶段 5：交互（鼠标拖动 / 滚轮缩放 / 触摸）
   ========================================================================== */
var dragging = false, lastX = 0, lastY = 0;

canvas.addEventListener('mousedown', function (e) {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mousemove', function (e) {
  if (!dragging) return;
  pan.x += e.clientX - lastX;
  pan.y += e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  render();
});

window.addEventListener('mouseup', function () { dragging = false; });

/* 以光标为中心缩放 */
function applyZoomAt(newZoom, cx, cy) {
  var cs = getContentSize();
  var fit = computeFitScale(cs.contentW, cs.contentH);
  var minZ = MIN_SCALE / fit, maxZ = MAX_SCALE / fit;
  newZoom = Math.max(minZ, Math.min(maxZ, newZoom));
  var newScale = fit * newZoom;
  var worldX = (cx - offsetX) / scale;
  var worldY = (cy - offsetY) / scale;
  zoom = newZoom;
  pan.x = (cx - worldX * newScale) - (canvas.clientWidth - cs.contentW * newScale) / 2;
  pan.y = (cy - worldY * newScale) - (canvas.clientHeight - cs.contentH * newScale) / 2;
  render();
}

canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  applyZoomAt(zoom * Math.exp(-e.deltaY * 0.0015), cx, cy);
}, { passive: false });

/* 触摸：单指拖动、双指缩放 */
var pinchDist = 0, pinchZoom = 1;

function touchDist(ts) {
  return Math.sqrt(
    Math.pow(ts[0].clientX - ts[1].clientX, 2) +
    Math.pow(ts[0].clientY - ts[1].clientY, 2)
  );
}

canvas.addEventListener('touchstart', function (e) {
  if (e.touches.length === 2) {
    pinchDist = touchDist(e.touches);
    pinchZoom = zoom;
  } else if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
}, { passive: true });

canvas.addEventListener('touchmove', function (e) {
  if (e.touches.length === 2 && pinchDist > 0) {
    var d = touchDist(e.touches);
    applyZoomAt(
      pinchZoom * (d / pinchDist),
      (e.touches[0].clientX + e.touches[1].clientX) / 2,
      (e.touches[0].clientY + e.touches[1].clientY) / 2
    );
  } else if (e.touches.length === 1 && dragging) {
    pan.x += e.touches[0].clientX - lastX;
    pan.y += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    render();
  }
}, { passive: true });

canvas.addEventListener('touchend', function () {
  dragging = false;
  pinchDist = 0;
});

/* ==========================================================================
   数据加载与初始化
   ========================================================================== */
function loadData(gens, fanout) {
  var result = genFamily(gens, fanout);
  members = result.members;
  root = result.root;
  layoutMap = calcLayout(root);
  index = buildSpatialIndex(members, layoutMap);
  boundsCache = null;
  pan = { x: 0, y: 0 };
  zoom = 1;

  document.getElementById('stat-nodes').textContent = members.length;
  document.getElementById('stat-gens').textContent = gens;
  var cs = getContentSize();
  document.getElementById('stat-size').textContent =
    Math.round(cs.contentW) + '×' + Math.round(cs.contentH);

  render();
}

document.querySelectorAll('.toolbar button[data-gens]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.toolbar button[data-gens]').forEach(function (b) {
      b.classList.remove('active');
    });
    btn.classList.add('active');
    loadData(parseInt(btn.dataset.gens, 10), parseInt(btn.dataset.fanout, 10));
  });
});

document.getElementById('reset').addEventListener('click', function () {
  pan = { x: 0, y: 0 };
  zoom = 1;
  render();
});

window.addEventListener('resize', function () {
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  render();
});

function init() {
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  loadData(8, 3); // 默认 3280 人
}
init();
</script>
</body>
</html>
