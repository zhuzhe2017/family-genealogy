version: '1.0'
name: family-genealogy-cicd
displayName: 数字家谱 CI/CD

# 触发条件：push 到 main/master 分支
triggers:
  push:
    branches:
      include:
        - main
        - master
  # 手动触发（Gitee 页面点击「运行」）
  manual: true

# 全局环境变量（可在 Gitee Go 环境变量中覆盖）
variables:
  PROD_BASE_URL: https://jiapuadmin.deejee.net   # 生产域名（用于冒烟测试）
  # ---- SSH 部署参数 ----
  DEPLOY_HOST: 106.54.52.45                       # 宝塔服务器 IP
  DEPLOY_USER: root                               # SSH 登录用户
  DEPLOY_PORT: 22                                 # SSH 端口
  DEPLOY_DIR: /www/wwwroot/family-genealogy       # 宝塔实际部署目录（PM2）
  PM2_APP_NAME: family-tree-api                   # PM2 进程名

stages:
  # ============================================================
  # 阶段一：CI（lint / test / build）
  # push 自动触发，3 个项目并行校验
  # ============================================================
  - stage:
    name: ci
    displayName: 持续集成
    strategy: fast
    trigger: auto
    steps:
      # 后端 CI
      - step: build@nodejs
        name: server-ci
        displayName: 后端 CI（lint/test/build）
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://npmmirror.com/mirrors/node/v20.19.6/node-v20.19.6-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH=/opt/node-v20.19.6-linux-x64/bin:$PATH
            fi
            node -v && npm -v
          - |
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --registry=https://registry.npmmirror.com
            fi
            pnpm -v
          - cd server
          - pnpm install --no-frozen-lockfile --registry=https://registry.npmmirror.com
          - pnpm lint
          - pnpm test
          - pnpm build

      # web-admin CI
      - step: build@nodejs
        name: web-admin-ci
        displayName: web-admin CI（lint/build）
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://npmmirror.com/mirrors/node/v20.19.6/node-v20.19.6-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH=/opt/node-v20.19.6-linux-x64/bin:$PATH
            fi
            node -v && npm -v
          - |
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --registry=https://registry.npmmirror.com
            fi
            pnpm -v
          - cd web-admin
          - pnpm install --no-frozen-lockfile --registry=https://registry.npmmirror.com
          - pnpm lint
          - pnpm build

      # tenant-web CI
      - step: build@nodejs
        name: tenant-web-ci
        displayName: tenant-web CI（lint/build）
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://npmmirror.com/mirrors/node/v20.19.6/node-v20.19.6-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH=/opt/node-v20.19.6-linux-x64/bin:$PATH
            fi
            node -v && npm -v
          - |
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --registry=https://registry.npmmirror.com
            fi
            pnpm -v
          - cd tenant-web
          - pnpm install --no-frozen-lockfile --registry=https://registry.npmmirror.com
          - pnpm lint
          - pnpm build

  # ============================================================
  # 阶段二：SSH 部署到宝塔 PM2（手动触发）
  # CI 通过后，手动点「运行」→ 选这个阶段部署
  # 前置：Gitee Go 密钥 DEPLOY_SSH_KEY_B64 = 服务器 root 私钥（base64）
  # ============================================================
  - stage:
    name: deploy
    displayName: 部署到宝塔（需手动触发）
    strategy: fast
    trigger: manual
    steps:
      # --- SSH 部署后端 + PM2 重启 ---
      - step: build@nodejs
        name: deploy-backend
        displayName: SSH 部署后端 + PM2 重启
        nodeVersion: 20.19.6
        commands:
          # 确保 SSH 客户端可用
          - |
            if ! command -v ssh >/dev/null 2>&1; then
              (apt-get update -qq && apt-get install -y -qq openssh-client) 2>/dev/null || apk add --no-cache openssh-client
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} \
              "set -e
               echo '=== [1/5] Pull latest code ==='
               cd ${DEPLOY_DIR} && git pull origin master
               echo '=== [2/5] npm install (生产依赖) ==='
               cd server && npm install --production --no-audit --no-fund --registry=https://registry.npmmirror.com
               echo '=== [3/5] build ==='
               npm run build
               echo '=== [4/5] pm2 restart ==='
               pm2 restart ${PM2_APP_NAME} || pm2 start dist/main.js --name ${PM2_APP_NAME}
               pm2 save
               echo '=== [5/5] health check ==='
               sleep 5
               curl -sf http://127.0.0.1:3003/api/health || echo 'WARNING: health check failed, check pm2 logs'
               pm2 logs ${PM2_APP_NAME} --lines 10 --nostream"

      # --- 冒烟测试（从公网验证） ---
      - step: build@nodejs
        name: smoke-test
        displayName: 生产冒烟测试
        nodeVersion: 20.19.6
        commands:
          - echo "=== 冒烟测试 ${PROD_BASE_URL} ==="
          - curl -sf "${PROD_BASE_URL}/api/cultural-doc/public/list?pageSize=3" && echo "✅ 古籍 OK" || echo "❌ 古籍 API 异常"
          - curl -sf "${PROD_BASE_URL}/api/cultural-dict/stats" && echo "✅ 字典 OK" || echo "❌ 字典 API 异常"
          - curl -s -o /dev/null -w "AI session (expect 401): HTTP %{http_code}\n" "${PROD_BASE_URL}/api/ai/1/session" -X POST

# ============================================================
# Gitee Go 环境变量/密钥配置清单
# 配置路径：Gitee 仓库 → 设置 → Gitee Go → 环境变量 / 密钥
# ============================================================
#
# 【密钥 Secrets（必须）】
#   DEPLOY_SSH_KEY_B64     服务器 root 私钥（base64 编码）
#                          生成：ssh-keygen -t rsa -b 4096 -C "gitee-ci"
#                          cat ~/.ssh/gitee_ci_key | base64 -w0
#                          服务器需将对应公钥追加到 ~root/.ssh/authorized_keys
#
# 【环境变量 Variables】（已内置于文件顶部 variables，可覆盖）
#   PROD_BASE_URL          生产域名（当前：https://jiapuadmin.deejee.net）
#   DEPLOY_HOST            服务器 IP（当前：106.54.52.45）
#   DEPLOY_USER            SSH 用户（当前：root）
#   DEPLOY_PORT            SSH 端口（当前：22）
#   DEPLOY_DIR             宝塔部署目录（当前：/www/wwwroot/family-genealogy）
#   PM2_APP_NAME           PM2 进程名（当前：family-tree-api）
#
# 【服务器前置条件】
#   1. 已开放 22 端口供 Gitee Go runner 出口 IP 访问
#   2. 已安装 git / node / npm / pm2
#   3. DEPLOY_DIR 已 clone 仓库并运行过 pm2 start
#   4. 已将 Gitee CI 公钥加入 authorized_keys
#
# ============================================================
