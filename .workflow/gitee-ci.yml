version: '1.0'
name: family-genealogy-cicd
displayName: 数字家谱 CI/CD

# 触发条件：push 到 main/master 分支
triggers:
  push:
    branches:
      include:
        - main
        - master
  # 手动触发（Gitee 页面点击「运行」）
  manual: true

# 全局环境变量（可在 Gitee Go 环境变量中覆盖）
variables:
  REGISTRY: registry.gitee.com
  NAMESPACE: zhuzhe
  PROD_BASE_URL: https://jiapuadmin.deejee.net   # 生产域名（用于冒烟测试）
  PROD_HOST: 106.54.52.45   # 生产服务器 IP
  # ---- SSH 部署参数（个人版无「计算资源管理」，改用 SSH 方式部署）----
  DEPLOY_HOST: 106.54.52.45          # 目标服务器 IP（staging 与 production 共用）
  DEPLOY_USER: root                   # SSH 登录用户
  DEPLOY_PORT: 22                     # SSH 端口
  STAGING_DIR: /opt/family-genealogy-staging   # staging 部署目录（与生产隔离）
  PROD_DIR: /opt/family-genealogy     # production 部署目录

stages:
  # ============================================================
  # 阶段一：CI（lint / test / build）
  # ============================================================
  - stage:
    name: ci
    displayName: 持续集成
    strategy: fast   # 快速失败：任一任务失败即停止
    trigger: auto
    steps:
      # 后端 CI
      - step: build@nodejs
        name: server-ci
        displayName: 后端 CI（lint/test/build）
        nodeVersion: 20.19.6
        commands:
          # 任务镜像（plugin-24）未预装 Node/npm，若插件初始化失败则手动下载注入
          - |
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://npmmirror.com/mirrors/node/v20.19.6/node-v20.19.6-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH=/opt/node-v20.19.6-linux-x64/bin:$PATH
            fi
            node -v && npm -v
          # 项目为 pnpm workspace（依赖使用 workspace:* 协议），必须用 pnpm 安装
          - |
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --registry=https://registry.npmmirror.com
            fi
            pnpm -v
          - cd server
          - pnpm install --no-frozen-lockfile --registry=https://registry.npmmirror.com
          - pnpm lint
          - pnpm test
          - pnpm build

      # web-admin CI
      - step: build@nodejs
        name: web-admin-ci
        displayName: web-admin CI（lint/build）
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://npmmirror.com/mirrors/node/v20.19.6/node-v20.19.6-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH=/opt/node-v20.19.6-linux-x64/bin:$PATH
            fi
            node -v && npm -v
          # 项目为 pnpm workspace（依赖使用 workspace:* 协议），必须用 pnpm 安装
          - |
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --registry=https://registry.npmmirror.com
            fi
            pnpm -v
          - cd web-admin
          - pnpm install --no-frozen-lockfile --registry=https://registry.npmmirror.com
          - pnpm lint
          - pnpm build

      # tenant-web CI
      - step: build@nodejs
        name: tenant-web-ci
        displayName: tenant-web CI（lint/build）
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://npmmirror.com/mirrors/node/v20.19.6/node-v20.19.6-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH=/opt/node-v20.19.6-linux-x64/bin:$PATH
            fi
            node -v && npm -v
          # 项目为 pnpm workspace（依赖使用 workspace:* 协议），必须用 pnpm 安装
          - |
            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10 --registry=https://registry.npmmirror.com
            fi
            pnpm -v
          - cd tenant-web
          - pnpm install --no-frozen-lockfile --registry=https://registry.npmmirror.com
          - pnpm lint
          - pnpm build

  # ============================================================
  # 阶段二：构建镜像 → 推送镜像仓库（build@docker 插件，凭证认证）
  # 前置：Gitee Go 凭证管理中已配置 Docker Registry 凭证 gitee-docker-registry
  #       （仓库地址 registry.gitee.com / 用户名 myuser / 密码）
  # ============================================================
  - stage:
    name: docker
    displayName: 构建镜像
    strategy: fast
    trigger: auto
    steps:
      - step: build@docker
        name: build-server
        displayName: 构建后端镜像
        certificate: gitee-docker-registry
        tag: ${NAMESPACE}/family-server:${GITEE_PIPELINE_BUILD_NUMBER}
        dockerfile: ./server/Dockerfile
        context: ./server

      - step: build@docker
        name: build-web-admin
        displayName: 构建 web-admin 镜像
        certificate: gitee-docker-registry
        tag: ${NAMESPACE}/family-web-admin:${GITEE_PIPELINE_BUILD_NUMBER}
        dockerfile: ./web-admin/Dockerfile
        context: ./web-admin

      - step: build@docker
        name: build-tenant-web
        displayName: 构建 tenant-web 镜像
        certificate: gitee-docker-registry
        tag: ${NAMESPACE}/family-tenant-web:${GITEE_PIPELINE_BUILD_NUMBER}
        dockerfile: ./tenant-web/Dockerfile
        context: ./tenant-web

  # ============================================================
  # 阶段三：部署到 Staging（自动，无需审批）
  # 个人版无「计算资源管理」，改用 SSH 方式部署
  # 前置：
  #   1. Gitee Go 密钥 DEPLOY_SSH_KEY_B64 = 服务器登录私钥（base64 编码）
  #   2. 服务器 ${STAGING_DIR} 已存在（含 docker-compose.yml 与 .env）
  # ============================================================
  - stage:
    name: deploy-staging
    displayName: 部署 Staging（自动）
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: deploy-staging
        displayName: SSH 自动部署到 Staging
        nodeVersion: 20.19.6
        commands:
          # 确保 SSH 客户端可用（任务镜像可能未预装）
          - |
            if ! command -v ssh >/dev/null 2>&1; then
              (apt-get update -qq && apt-get install -y -qq openssh-client) 2>/dev/null || apk add --no-cache openssh-client
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} \
              "DEPLOY_ENV=staging STAGING_DIR=${STAGING_DIR} PROD_DIR=${PROD_DIR} bash -s" < scripts/remote-deploy.sh

  # ============================================================
  # 阶段四：部署到 Production（人工卡点，需审批）
  # ============================================================
  - stage:
    name: deploy-production
    displayName: 部署 Production（需审批）
    strategy: fast
    trigger: manual   # 手动触发，需人工审批
    steps:
      # 部署前备份数据库（回滚兜底）
      - step: build@nodejs
        name: backup-db
        displayName: 部署前备份数据库
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v ssh >/dev/null 2>&1; then
              (apt-get update -qq && apt-get install -y -qq openssh-client) 2>/dev/null || apk add --no-cache openssh-client
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} \
              "cd ${PROD_DIR} && bash -s" < scripts/backup-db.sh

      # 部署到 production 服务器
      - step: build@nodejs
        name: deploy-production
        displayName: 部署到 Production 服务器
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v ssh >/dev/null 2>&1; then
              (apt-get update -qq && apt-get install -y -qq openssh-client) 2>/dev/null || apk add --no-cache openssh-client
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} \
              "DEPLOY_ENV=production STAGING_DIR=${STAGING_DIR} PROD_DIR=${PROD_DIR} PROD_BASE_URL=${PROD_BASE_URL} bash -s" < scripts/remote-deploy.sh

      # 生产冒烟测试（核心 API 验证）
      - step: build@nodejs
        name: smoke-test
        displayName: 生产冒烟测试
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v ssh >/dev/null 2>&1; then
              (apt-get update -qq && apt-get install -y -qq openssh-client) 2>/dev/null || apk add --no-cache openssh-client
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} \
              "SMOKE_BASE_URL=${PROD_BASE_URL} bash -s" < scripts/smoke-test.sh

      # 失败回滚（重启服务并验证）
      - step: build@nodejs
        name: rollback
        displayName: 失败回滚
        nodeVersion: 20.19.6
        commands:
          - |
            if ! command -v ssh >/dev/null 2>&1; then
              (apt-get update -qq && apt-get install -y -qq openssh-client) 2>/dev/null || apk add --no-cache openssh-client
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} "
              set -e
              cd ${PROD_DIR}
              echo 'Deployment failed, initiating rollback...'

              # 记录当前镜像标签
              docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format 'table {{.Name}}\t{{.Image}}'

              # 尝试重启服务（简单恢复）
              docker compose -f docker-compose.yml -f docker-compose.prod.yml restart

              # 等待并验证
              sleep 10
              for i in \$(seq 1 30); do
                if curl -sfk https://localhost/api/health > /dev/null 2>&1; then
                  echo 'Rollback successful'
                  exit 0
                fi
                sleep 2
              done

              echo 'Rollback failed, manual intervention required. See docs/rollback-runbook.md'
              exit 1
            "

# ============================================================
# Gitee Go 环境变量/密钥配置清单
# 配置路径：Gitee 仓库 → 设置 → Gitee Go → 环境变量 / 密钥
# ============================================================
#
# 【密钥 Secrets】
#   REGISTRY_USERNAME      镜像仓库账号（registry.gitee.com 的登录账号）
#   REGISTRY_PASSWORD      镜像仓库密码
#   DEPLOY_SSH_KEY_B64     服务器登录私钥（base64 编码，root 用户）
#                          生成：cat ~/.ssh/id_rsa | base64 -w0
#                          服务器需将对应公钥加入 authorized_keys
#
# 【环境变量 Variables】（已内置于文件顶部 variables，可覆盖）
#   REGISTRY               镜像仓库地址
#   NAMESPACE              镜像仓库命名空间（当前：zhuzhe）
#   PROD_BASE_URL          生产环境域名（当前：https://jiapuadmin.deejee.net）
#   DEPLOY_HOST            部署服务器 IP（当前：106.54.52.45）
#   DEPLOY_USER            SSH 登录用户（当前：root）
#   DEPLOY_PORT            SSH 端口（当前：22）
#   STAGING_DIR            staging 部署目录（当前：/opt/family-genealogy-staging）
#   PROD_DIR               production 部署目录（当前：/opt/family-genealogy）
#
# 【服务器前置条件】
#   1. 已安装 Docker 与 Docker Compose v2
#   2. ${STAGING_DIR} / ${PROD_DIR} 目录已就绪，含 docker-compose 编排文件与 .env
#   3. 服务器已放行 CI 出口 IP 的 22 端口（SSH）
#
# 注意：个人版 Gitee Go 无「计算资源管理」，故部署采用 SSH + stdin 脚本方式
#      远程脚本：scripts/remote-deploy.sh / scripts/backup-db.sh / scripts/smoke-test.sh
#
# ============================================================
