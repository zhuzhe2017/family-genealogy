version: '1.0'
name: family-genealogy-cicd
displayName: 数字家谱 CI/CD

# 触发条件：push 到 main/master 分支
triggers:
  push:
    branches:
      include:
        - main
        - master
  # 手动触发（Gitee 页面点击「运行」）
  manual: true

# 全局环境变量（可在 Gitee Go 环境变量中覆盖）
variables:
  REGISTRY: docker.io
  NAMESPACE: your-registry-namespace   # TODO: 替换为实际镜像仓库命名空间
  PROD_BASE_URL: https://jiapuadmin.deejee.net   # 生产域名（用于冒烟测试）
  PROD_HOST: 106.54.52.45   # 生产服务器 IP

stages:
  # ============================================================
  # 阶段一：CI（lint / test / build）
  # ============================================================
  - stage:
    name: ci
    displayName: 持续集成
    strategy: fast   # 快速失败：任一任务失败即停止
    trigger: auto
    steps:
      # 后端 CI
      - step: build@nodejs
        name: server-ci
        displayName: 后端 CI（lint/test/build）
        nodeVersion: 20.11.0
        commands:
          - cd server
          - pnpm install --frozen-lockfile
          - pnpm lint
          - pnpm test
          - pnpm build

      # web-admin CI
      - step: build@nodejs
        name: web-admin-ci
        displayName: web-admin CI（lint/build）
        nodeVersion: 20.11.0
        commands:
          - cd web-admin
          - pnpm install --frozen-lockfile
          - pnpm lint
          - pnpm build

      # tenant-web CI
      - step: build@nodejs
        name: tenant-web-ci
        displayName: tenant-web CI（lint/build）
        nodeVersion: 20.11.0
        commands:
          - cd tenant-web
          - pnpm install --frozen-lockfile
          - pnpm lint
          - pnpm build

  # ============================================================
  # 阶段二：构建镜像 → 推送镜像仓库
  # ============================================================
  - stage:
    name: docker
    displayName: 构建镜像
    strategy: fast
    trigger: auto
    steps:
      - step: build@docker
        name: build-push
        displayName: 构建并推送镜像
        commands:
          - docker login -u $REGISTRY_USERNAME -p $REGISTRY_PASSWORD $REGISTRY
          # 后端镜像
          - docker build -t $REGISTRY/$NAMESPACE/family-server:$CI_COMMIT_SHORT_SHA -t $REGISTRY/$NAMESPACE/family-server:latest ./server
          - docker push $REGISTRY/$NAMESPACE/family-server:$CI_COMMIT_SHORT_SHA
          - docker push $REGISTRY/$NAMESPACE/family-server:latest
          # web-admin 镜像
          - docker build -t $REGISTRY/$NAMESPACE/family-web-admin:$CI_COMMIT_SHORT_SHA -t $REGISTRY/$NAMESPACE/family-web-admin:latest ./web-admin
          - docker push $REGISTRY/$NAMESPACE/family-web-admin:$CI_COMMIT_SHORT_SHA
          - docker push $REGISTRY/$NAMESPACE/family-web-admin:latest
          # tenant-web 镜像
          - docker build -t $REGISTRY/$NAMESPACE/family-tenant-web:$CI_COMMIT_SHORT_SHA -t $REGISTRY/$NAMESPACE/family-tenant-web:latest ./tenant-web
          - docker push $REGISTRY/$NAMESPACE/family-tenant-web:$CI_COMMIT_SHORT_SHA
          - docker push $REGISTRY/$NAMESPACE/family-tenant-web:latest

  # ============================================================
  # 阶段三：部署到 Staging（自动，无需审批）
  # ============================================================
  - stage:
    name: deploy-staging
    displayName: 部署 Staging（自动）
    strategy: fast
    trigger: auto
    steps:
      - step: deploy@host
        name: deploy-staging
        displayName: 自动部署到 Staging
        hostGroup: your-host-group   # TODO: 替换为实际主机组名称
        host: $STAGING_HOST
        user: $DEPLOY_USER
        scriptType: shell
        script: |
          set -e
          cd $DEPLOY_PATH
          # 拉取最新镜像
          docker compose pull
          # 滚动重启
          docker compose up -d --remove-orphans
          # 健康检查（最长 60s）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo 'Staging backend is healthy'
              exit 0
            fi
            sleep 2
          done
          echo 'Staging health check failed after 60s'
          exit 1

  # ============================================================
  # 阶段四：部署到 Production（人工卡点，需审批）
  # ============================================================
  - stage:
    name: deploy-production
    displayName: 部署 Production（需审批）
    strategy: fast
    trigger: manual   # 手动触发，需人工审批
    steps:
      # 部署前备份数据库（回滚兜底）
      - step: deploy@host
        name: backup-db
        displayName: 部署前备份数据库
        hostGroup: your-host-group   # TODO: 替换为实际主机组名称
        host: $PROD_HOST
        user: $DEPLOY_USER
        scriptType: shell
        script: |
          set -e
          cd $DEPLOY_PATH
          bash scripts/backup-db.sh

      # 部署到 production 服务器
      - step: deploy@host
        name: deploy-production
        displayName: 部署到 Production 服务器
        hostGroup: your-host-group   # TODO: 替换为实际主机组名称
        host: $PROD_HOST
        user: $DEPLOY_USER
        scriptType: shell
        script: |
          set -e
          cd $DEPLOY_PATH
          # 拉取最新镜像
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          # 滚动重启
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
          # 健康检查（最长 60s）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo 'Production backend is healthy'
              exit 0
            fi
            sleep 2
          done
          echo 'Production health check failed after 60s'
          exit 1

      # 生产冒烟测试（核心 API 验证）
      - step: deploy@host
        name: smoke-test
        displayName: 生产冒烟测试
        hostGroup: your-host-group   # TODO: 替换为实际主机组名称
        host: $PROD_HOST
        user: $DEPLOY_USER
        scriptType: shell
        script: |
          set -e
          cd $DEPLOY_PATH
          bash scripts/smoke-test.sh $PROD_BASE_URL

      # 失败回滚（重启服务并验证）
      - step: deploy@host
        name: rollback
        displayName: 失败回滚
        hostGroup: your-host-group   # TODO: 替换为实际主机组名称
        host: $PROD_HOST
        user: $DEPLOY_USER
        scriptType: shell
        script: |
          set -e
          cd $DEPLOY_PATH
          echo 'Deployment failed, initiating rollback...'
          
          # 记录当前镜像标签
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format 'table {{.Name}}\t{{.Image}}'
          
          # 尝试重启服务（简单恢复）
          docker compose -f docker-compose.yml -f docker-compose.prod.yml restart
          
          # 等待并验证
          sleep 10
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo 'Rollback successful'
              exit 0
            fi
            sleep 2
          done
          
          echo 'Rollback failed, manual intervention required. See docs/rollback-runbook.md'
          exit 1

# ============================================================
# Gitee Go 环境变量/密钥配置清单
# 配置路径：Gitee 仓库 → 设置 → Gitee Go → 环境变量 / 密钥
# ============================================================
#
# 【密钥 Secrets】
#   REGISTRY_USERNAME      镜像仓库账号（Docker Hub / 阿里云 ACR / 腾讯云 TCR）
#   REGISTRY_PASSWORD      镜像仓库密码
#   DEPLOY_SSH_KEY         SSH 私钥（用于免密登录 staging/production 服务器）
#
# 【环境变量 Variables】
#   REGISTRY               镜像仓库地址（如 docker.io / registry.cn-hangzhou.aliyuncs.com）
#   NAMESPACE              镜像仓库命名空间（如 your-username / your-org）
#
#   STAGING_HOST           Staging 服务器 IP/域名（如 106.54.52.45）
#   PROD_HOST              Production 服务器 IP/域名（当前：106.54.52.45）
#   DEPLOY_USER            SSH 登录用户（如 root / ubuntu）
#   DEPLOY_PATH            项目部署目录（如 /opt/family-genealogy）
#   PROD_BASE_URL          生产环境域名（当前：https://jiapuadmin.deejee.net）
#
# 【主机组配置】
#   your-host-group        Gitee Go 计算资源管理中添加的主机组名称
#
# ============================================================
