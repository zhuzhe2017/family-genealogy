# web-admin 生产 nginx 配置（HTTPS 终止 + HTTP 强制跳转）
# 覆盖镜像内默认配置，需配合 docker-compose.prod.yml 挂载的 TLS 证书使用
# 环境变量由容器启动时 envsubst 注入：BACKEND_HOST / BACKEND_PORT

server {
    listen       80;
    server_name  admin.your-domain.com;   # TODO: 替换为实际域名

    # 所有 HTTP 请求强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    http2        on;
    server_name  admin.your-domain.com;   # TODO: 替换为实际域名

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root   /usr/share/nginx/html;
    index  index.html;

    # 前端静态资源：JS/CSS/图片长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        client_max_body_size  10m;
    }

    # 反向代理后端上传文件
    location /uploads/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        expires 7d;
        add_header Cache-Control "public";
    }

    # 安全响应头（含 HTTPS 强制 HSTS）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
